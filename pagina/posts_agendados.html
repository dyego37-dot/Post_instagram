<title>Posts do @sistemaafiliados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6fb; --surface:#ffffff; --fg:#0e1726; --muted:#5b6b82; --line:#dbe3ee;
  --accent:#1f6fff; --accent-soft:#e3edff;
  --ok:#11845b; --ok-soft:#e1f5ec; --warn:#a05a00; --warn-soft:#fff1dc; --bad:#c0322b; --bad-soft:#fde6e4;
  --display:"Sora",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070b14; --surface:#0f1626; --fg:#e8eef8; --muted:#8fa0b8; --line:#1f2a40;
  --accent:#4d8dff; --accent-soft:#132342;
  --ok:#3ccf93; --ok-soft:#0e2a20; --warn:#f2a640; --warn-soft:#2c1f0b; --bad:#ff7a70; --bad-soft:#2f1412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070b14; --surface:#0f1626; --fg:#e8eef8; --muted:#8fa0b8; --line:#1f2a40;
  --accent:#4d8dff; --accent-soft:#132342;
  --ok:#3ccf93; --ok-soft:#0e2a20; --warn:#f2a640; --warn-soft:#2c1f0b; --bad:#ff7a70; --bad-soft:#2f1412; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.upd{color:var(--muted);font-size:13px;margin-left:auto}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.msg b{color:var(--fg)}
.day{display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.dayhead h2{font-family:var(--display);font-size:1.1rem;margin:0}
.tag-today{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:2px 8px;border-radius:999px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ihead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font-family:var(--display);font-weight:600;font-size:14px}
.time{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.wait{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.net{font-size:12px;color:var(--muted)}
.what{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 10px;align-self:flex-start}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.strip img{flex:0 0 auto;width:68%;max-width:260px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;scroll-snap-align:start;background:var(--line);cursor:zoom-in}
.strip.story img{width:42%;max-width:170px;aspect-ratio:9/16}
.strip video{flex:0 0 auto;width:42%;max-width:200px;aspect-ratio:9/16;border-radius:10px;background:#000}
.count{font-size:12px;color:var(--muted)}
.cap{white-space:pre-wrap;margin:0;font-size:14px;max-height:7.5em;overflow:hidden;position:relative}
.cap.open{max-height:none}
.more{background:none;border:0;padding:0;color:var(--accent);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}
.links a{color:var(--accent);font-weight:600;text-decoration:none}
.empty{color:var(--bad);font-weight:600}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom img{max-height:100%;max-width:100%;border-radius:8px}
</style>

<div class="wrap">
  <header>
    <h1>Posts do @sistemaafiliados</h1>
    <p class="sub">Tudo o que está agendado no Metricool para o Instagram e o Facebook, com as imagens, a legenda e a situação de cada um. Atualiza sozinho.</p>
  </header>
  <div class="bar">
    <button id="f-next" class="on" type="button">Próximos</button>
    <button id="f-past" type="button">Já publicados</button>
    <button id="reload" type="button">Atualizar agora</button>
    <span class="upd" id="upd"></span>
  </div>
  <div id="out"><div class="msg">Carregando os posts do Metricool…</div></div>
</div>
<div class="zoom" id="zoom" hidden><img id="zoomimg" alt=""></div>

<script>
const SERVER="Metricool Social Media Management", TOOL="getScheduledPosts", BRAND="7676659", TZ="America/Sao_Paulo";
const out=document.getElementById("out"), upd=document.getElementById("upd");
let mode="next", posts=null, mcpRef=null, idx={};
fetch("p/index.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(j=>{idx=j||{};render();}).catch(()=>{});

function ymd(d){return d.toLocaleDateString("en-CA",{timeZone:TZ});}
function todayStr(){return ymd(new Date());}
function addDays(s,n){const d=new Date(s+"T12:00:00-03:00");d.setUTCDate(d.getUTCDate()+n);return ymd(d);}
function input(){const t=todayStr();return{brandId:BRAND,fromDate:addDays(t,-10)+"T00:00:00-03:00",toDate:addDays(t,30)+"T23:59:59-03:00",timezone:TZ};}

const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function dayLabel(s){const d=new Date(s+"T12:00:00-03:00");return{wd:DIAS[d.getUTCDay()],dm:d.getUTCDate()+" de "+MESES[d.getUTCMonth()]};}

function statusOf(p){
  const st=(p.providers||[]).map(x=>(x.status||"").toUpperCase());
  if(!st.length) return ["Sem rede","warn"];
  if(st.every(s=>s==="PUBLISHED")) return ["Publicado","ok"];
  if(st.some(s=>s.includes("ERROR")||s.includes("FAIL"))) return ["Deu erro","bad"];
  if(p.draft) return ["Rascunho","warn"];
  if(st.some(s=>s==="PUBLISHED")) return ["Publicado em parte","warn"];
  return ["Agendado","wait"];
}
function kindOf(p){
  const t=(p.instagramData&&p.instagramData.type)||"POST";
  if(t==="STORY") return "Story";
  if(t==="REEL") return "Reels";
  return (p.media||[]).length>1?"Carrossel":"Post";
}
const isVideo=u=>/\.(mp4|mov|webm)(\?|$)/i.test(u);

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

/* Escolhe as imagens guardadas nesta página para um post. Só usa quando batem com o post do Metricool
   (mesma quantidade de arquivos e mesmo período do dia); se não baterem, não mostra imagem de outro post. */
function localMedia(p,k){
  const d=p.publicationDate.dateTime.slice(0,10), loc=idx[d]; if(!loc) return [];
  const tarde=parseInt(p.publicationDate.dateTime.slice(11,13),10)>=12;
  let list;
  if(k==="Story") list=tarde?[]:(loc.story||[]);
  else list=tarde?(loc.tarde||[]):(loc.post||[]);
  const n=(p.media||[]).length;
  if(!list.length||list.length!==n) return [];
  return list;
}


function remoteStrip(urls,k){
  const wrap=el("div"),s=el("div","strip"+(k==="Story"||k==="Reels"?" story":"")),note=el("div","count");
  let left=urls.length;
  const fail=()=>{left--;if(left<=0){s.remove();note.textContent=urls.some(isVideo)?"Vídeo — para assistir, abra no Metricool.":"A imagem está no Metricool.";}};
  urls.forEach((u,i)=>{
    if(isVideo(u)){const v=el("video");v.src=u;v.controls=true;v.preload="metadata";v.playsInline=true;v.muted=true;v.addEventListener("error",()=>{v.remove();fail();});s.append(v);}
    else{const im=el("img");im.src=u;im.alt=k+" "+(i+1);im.addEventListener("error",()=>{im.remove();fail();});im.addEventListener("click",()=>openZoom(u));s.append(im);}
  });
  wrap.append(s,note);
  if(urls.length>1) note.textContent=urls.length+(k==="Story"?" stories":" telas")+" — arraste para o lado para ver todos";
  return wrap;
}
const NOME={"Story":"story","Reels":"Reels","Carrossel":"tirinha (carrossel)","Post":"post"};

function render(){
  if(!posts) return;
  const t=todayStr();
  const list=posts.filter(p=>{const d=(p.publicationDate&&p.publicationDate.dateTime||"").slice(0,10);return mode==="next"?d>=t:d<t;})
    .sort((a,b)=>(a.publicationDate.dateTime<b.publicationDate.dateTime?-1:1)*(mode==="next"?1:-1));
  out.replaceChildren();
  if(mode==="next"){
    const days=new Set(list.filter(p=>parseInt(p.publicationDate.dateTime.slice(11,13),10)<12).map(p=>p.publicationDate.dateTime.slice(0,10)));
    const missing=[0,1,2].map(n=>addDays(t,n)).filter(d=>!days.has(d));
    if(missing.length){const m=el("div","msg");m.append(el("b",null,"Atenção: "),document.createTextNode("ainda não há post das 6h agendado para "+missing.map(d=>{const l=dayLabel(d);return l.wd+", "+l.dm;}).join(" e ")+". O post de cada dia é criado na tarde anterior, às 17h40."));out.append(m);}
  }
  if(!list.length){out.append(el("div","msg",mode==="next"?"Nenhum post agendado daqui para frente.":"Nenhum post publicado nos últimos 10 dias."));return;}
  const groups={};
  list.forEach(p=>{const d=p.publicationDate.dateTime.slice(0,10);(groups[d]=groups[d]||[]).push(p);});
  const box=el("div");box.style.cssText="display:flex;flex-direction:column;gap:22px";
  Object.keys(groups).forEach(d=>{
    const sec=el("section","day"),h=el("div","dayhead"),l=dayLabel(d);
    h.append(el("h2",null,l.wd.charAt(0).toUpperCase()+l.wd.slice(1)+", "+l.dm));
    if(d===t) h.append(el("span","tag-today","hoje"));
    else if(d===addDays(t,1)) h.append(el("span","tag-today","amanhã"));
    sec.append(h);
    const items=groups[d].sort((a,b)=>a.publicationDate.dateTime<b.publicationDate.dateTime?-1:1);
    const blocks=[];
    items.forEach(p=>{
      const last=blocks[blocks.length-1];
      const mins=x=>{const t=x.publicationDate.dateTime;return parseInt(t.slice(11,13),10)*60+parseInt(t.slice(14,16),10);};
      if(kindOf(p)==="Story"&&last&&kindOf(last[last.length-1])==="Story"&&mins(p)-mins(last[last.length-1])<=15) last.push(p);
      else blocks.push([p]);
    });
    const resumo=blocks.map(b=>{const h=b[0].publicationDate.dateTime.slice(11,16).replace(":00","h").replace(":","h");
      const k=kindOf(b[0]);return h+" "+(k==="Story"&&b.length>1?b.length+" stories":NOME[k]);});
    sec.append(el("div","count","No dia: "+resumo.join(" · ")));
    blocks.forEach(b=>sec.append(b.length>1?storyGroup(b):card(b[0])));
    box.append(sec);
  });
  out.append(box);
}

function card(p){
  const c=el("article","item"),hd=el("div","ihead"),k=kindOf(p),[st,cls]=statusOf(p);
  hd.append(el("span","kind",k),el("span","time",p.publicationDate.dateTime.slice(11,16)),el("span","chip "+cls,st));
  const nets=(p.providers||[]).map(x=>x.network==="instagram"?"Instagram":x.network==="facebook"?"Facebook":x.network).join(" + ");
  if(nets) hd.append(el("span","net",nets));
  if(p.instagramData&&Array.isArray(p.instagramData.collaborators)&&p.instagramData.collaborators.length)
    hd.append(el("span","net","em parceria com @"+p.instagramData.collaborators.map(x=>x.username).join(", @")));
  c.append(hd);
  const hr=parseInt(p.publicationDate.dateTime.slice(11,13),10);
  let what;
  if(k==="Story") what="📲 Story: aparece nos stories (some depois de 24h, não tem legenda)";
  else if(k==="Reels") what="🎬 Reels: vídeo no feed e na aba de Reels";
  else if(k==="Carrossel"&&hr>=12) what="🎨 Tirinha da tarde: carrossel no feed";
  else what="📰 Post do feed: fica no perfil, com legenda";
  c.append(el("div","what",what));
  const media=localMedia(p,k);
  if(media.length){
    const s=el("div","strip"+(k==="Story"||k==="Reels"?" story":""));
    media.forEach((u,i)=>{
      if(isVideo(u)){const v=el("video");v.src=u;v.controls=true;v.preload="metadata";v.playsInline=true;s.append(v);}
      else{const im=el("img");im.src=u;im.loading="lazy";im.addEventListener("error",()=>im.remove());im.alt=k+" — imagem "+(i+1);im.addEventListener("click",()=>openZoom(u));s.append(im);}
    });
    c.append(s);
    if(media.length>1) c.append(el("div","count",media.length+" telas — arraste para o lado para ver todas"));
  } else if((p.media||[]).length){
    c.append(remoteStrip(p.media,k));
  }
  if(p.text){
    const cap=el("p","cap",p.text);c.append(cap);
    if(p.text.split("\n").length>5||p.text.length>260){
      const b=el("button","more","Ver legenda inteira");b.type="button";
      b.addEventListener("click",()=>{cap.classList.toggle("open");b.textContent=cap.classList.contains("open")?"Mostrar menos":"Ver legenda inteira";});
      c.append(b);
    }
  } else if(k!=="Story") c.append(el("p","empty","Sem legenda"));
  const links=el("div","links");
  (p.providers||[]).forEach(x=>{if(x.publicUrl){const a=el("a",null,"Abrir no "+(x.network==="instagram"?"Instagram":"Facebook")+" ↗");a.href=x.publicUrl;a.target="_blank";a.rel="noopener";links.append(a);}
    if(x.detailedStatus&&/error|fail/i.test(x.detailedStatus)) links.append(el("span","empty",(x.network||"")+": "+x.detailedStatus));});
  if(links.childNodes.length) c.append(links);
  return c;
}


function storyGroup(b){
  const c=el("article","item"),hd=el("div","ihead"),[st,cls]=statusOf(b[0]);
  const t1=b[0].publicationDate.dateTime.slice(11,16),t2=b[b.length-1].publicationDate.dateTime.slice(11,16);
  hd.append(el("span","kind",b.length+" stories em sequência"),el("span","time",t1+" a "+t2),el("span","chip "+cls,st));
  c.append(hd);
  c.append(el("div","what","📲 Saem um atrás do outro e aparecem juntos nos stories (somem depois de 24h)"));
  const urls=[];b.forEach(p=>(p.media||[]).forEach(u=>urls.push(u)));
  if(urls.length) c.append(remoteStrip(urls,"Story"));
  return c;
}

function openZoom(u){const z=document.getElementById("zoom");document.getElementById("zoomimg").src=u;z.hidden=false;}
document.getElementById("zoom").addEventListener("click",e=>{e.currentTarget.hidden=true;});

function setUpd(res){
  const ts=res&&res.cache?res.cache.storedAt:Date.now();
  upd.textContent="Atualizado às "+new Date(ts).toLocaleTimeString("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
}
function showError(err){
  const m=el("div","msg"),c=err&&err.code;
  if(c==="needs_reauth") m.textContent="O Metricool pediu para entrar de novo. Abra o claude.ai em Configurações → Conectores e reconecte o Metricool.";
  else if(c==="server_not_connected"||c==="selection_required") m.textContent="O Metricool não está conectado nesta conta. Adicione o conector do Metricool em Configurações → Conectores do claude.ai.";
  else if(c==="not_in_manifest"||c==="approval_required"||c==="blocked_by_policy"){m.textContent="Esta página precisa da sua permissão para ler o Metricool. ";const b=el("button",null,"Permitir e carregar");b.type="button";b.addEventListener("click",()=>load(true));m.append(b);}
  else if(c==="server_unavailable"||c==="upstream_error") m.textContent="O Metricool não respondeu agora. Toque em Atualizar agora daqui a pouco.";
  else m.textContent="Não deu para ler o Metricool ("+(err&&err.message||"erro desconhecido")+").";
  if(!posts){out.replaceChildren(m);} else {out.prepend(m);}
}
function take(res){
  const pl=res&&res.payload;const arr=Array.isArray(pl)?pl:(pl&&Array.isArray(pl.data)?pl.data:null);
  if(!arr){showError({message:"resposta inesperada do Metricool"});return;}
  posts=arr;setUpd(res);render();
}
function ranges(){const t=todayStr(),out=[];for(let d=-10;d<=30;d+=4){const a=addDays(t,d),b=addDays(t,Math.min(d+3,30));out.push({brandId:BRAND,fromDate:a+"T00:00:00-03:00",toDate:b+"T23:59:59-03:00",timezone:TZ});}return out;}
let loading=false;
async function load(){
  if(!mcpRef||loading) return; loading=true;
  const all={}; let fail=null, last=null;
  for(const inp of ranges()){
    try{const res=await mcpRef.callTool(SERVER,TOOL,inp,{cache:{refresh:true,staleTime:0,gcTime:600000}});
      const pl=res&&res.payload;const arr=Array.isArray(pl)?pl:(pl&&Array.isArray(pl.data)?pl.data:[]);
      arr.forEach(p=>{all[p.uuid||p.id]=p;}); last=res;}
    catch(e){fail=e; if(e&&["needs_reauth","server_not_connected","selection_required","not_in_manifest","approval_required","blocked_by_policy"].includes(e.code)) break;}
  }
  loading=false;
  const arr=Object.values(all);
  if(arr.length){posts=arr;setUpd(last);render();}
  if(fail) showError(fail);
}

document.getElementById("f-next").addEventListener("click",e=>{mode="next";e.currentTarget.classList.add("on");document.getElementById("f-past").classList.remove("on");render();});
document.getElementById("f-past").addEventListener("click",e=>{mode="past";e.currentTarget.classList.add("on");document.getElementById("f-next").classList.remove("on");render();});
document.getElementById("reload").addEventListener("click",()=>load());

(async()=>{
  let mcp=null;
  try{mcp=window.claude&&window.claude.use?await window.claude.use("mcp"):null;}catch(e){}
  if(!mcp){out.replaceChildren(el("div","msg","Abra esta página dentro do Claude (app ou claude.ai) para ver os posts do Metricool."));return;}
  mcpRef=mcp; load(); setInterval(load,300000);
})();
</script>
